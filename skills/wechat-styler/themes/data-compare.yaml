name: "data-compare"
description: "数据对比风：靛紫色系，表格样式突出，适合横向对比和选型类文章"
colors:
  primary: "#4f46e5"
  secondary: "#6366f1"
  text: "#111827"
  text_light: "#6b7280"
  background: "#ffffff"
  code_bg: "#f5f3ff"
  code_color: "#4338ca"
  quote_border: "#4f46e5"
  quote_bg: "#eef2ff"
  border_radius: "8px"
darkmode:
  background: "#1e1b4b"
  text: "#e0e7ff"
  text_light: "#a5b4fc"
  primary: "#818cf8"
  code_bg: "#1e1b4b"
  code_color: "#a5b4fc"
  quote_bg: "#1e1b4b"
  quote_border: "#818cf8"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.85;
    color: #111827;
    background: #ffffff;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    color: #111827;
    margin: 36px 0 20px 0;
    text-align: center;
    line-height: 1.4;
  }

  h2 {
    font-size: 20px;
    font-weight: 700;
    color: #4f46e5;
    margin: 32px 0 14px 0;
    padding-bottom: 10px;
    border-bottom: 3px solid #4f46e5;
    line-height: 1.4;
  }

  h3 {
    font-size: 17px;
    font-weight: 600;
    color: #374151;
    margin: 22px 0 10px 0;
    padding: 6px 12px;
    background: #eef2ff;
    border-radius: 6px;
    line-height: 1.4;
  }

  p {
    font-size: 16px;
    line-height: 1.85;
    color: #111827;
    margin: 14px 0;
  }

  strong {
    font-weight: 700;
    color: #4338ca;
  }

  em {
    font-style: italic;
    color: #6b7280;
  }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 13.5px;
    background: #f5f3ff;
    color: #4338ca;
    padding: 2px 7px;
    border-radius: 4px;
  }

  pre {
    background: #1e1b4b;
    color: #e0e7ff;
    padding: 16px 20px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 16px 0;
    line-height: 1.65;
  }

  pre code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 13.5px;
    background: none;
    color: #e0e7ff;
    padding: 0;
    border-radius: 0;
  }

  blockquote {
    border-left: 4px solid #4f46e5;
    background: #eef2ff;
    margin: 18px 0;
    padding: 12px 18px;
    border-radius: 0 8px 8px 0;
    color: #374151;
  }

  blockquote p {
    margin: 6px 0;
    color: #374151;
  }

  ul, ol {
    padding-left: 24px;
    margin: 14px 0;
  }

  li {
    font-size: 16px;
    line-height: 1.85;
    color: #111827;
    margin: 7px 0;
  }

  /* 表格是对比文的核心，样式最精细 */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    font-size: 14.5px;
    box-shadow: 0 1px 6px rgba(79, 70, 229, 0.12);
    border-radius: 8px;
    overflow: hidden;
  }

  th {
    background: #4f46e5;
    color: #ffffff;
    font-weight: 700;
    padding: 12px 16px;
    text-align: left;
    letter-spacing: 0.3px;
    font-size: 14px;
  }

  th:first-child {
    background: #3730a3;
  }

  td {
    padding: 11px 16px;
    border-bottom: 1px solid #e0e7ff;
    color: #111827;
    vertical-align: middle;
  }

  td:first-child {
    font-weight: 600;
    color: #4338ca;
    background: #f5f3ff;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:nth-child(even) td {
    background: #faf9ff;
  }

  tr:nth-child(even) td:first-child {
    background: #f0eeff;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 24px auto;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(79, 70, 229, 0.1);
  }

  a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: 500;
  }

  hr {
    border: none;
    border-top: 2px solid #e0e7ff;
    margin: 28px 0;
  }
