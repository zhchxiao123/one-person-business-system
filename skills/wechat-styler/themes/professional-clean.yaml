name: "professional-clean"
description: "简洁商务：蓝色系，适合技术文章和资讯内容"
colors:
  primary: "#1a73e8"
  secondary: "#5f6368"
  text: "#333333"
  text_light: "#666666"
  background: "#ffffff"
  code_bg: "#f8f9fa"
  code_color: "#d73a49"
  quote_border: "#1a73e8"
  quote_bg: "#e8f0fe"
  border_radius: "8px"
darkmode:
  background: "#1a1a1a"
  text: "#e0e0e0"
  text_light: "#9a9a9a"
  primary: "#8ab4f8"
  code_bg: "#2d2d2d"
  code_color: "#f8b4b4"
  quote_bg: "#1e2a3a"
  quote_border: "#8ab4f8"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.8;
    color: #333333;
    background: #ffffff;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    margin: 32px 0 18px 0;
    text-align: center;
    line-height: 1.4;
  }

  h2 {
    font-size: 20px;
    font-weight: 700;
    color: #1a73e8;
    margin: 28px 0 14px 0;
    padding-bottom: 8px;
    border-bottom: 2px solid #1a73e8;
    line-height: 1.4;
  }

  h3 {
    font-size: 17px;
    font-weight: 600;
    color: #333333;
    margin: 22px 0 10px 0;
    padding-left: 10px;
    border-left: 3px solid #1a73e8;
    line-height: 1.4;
  }

  p {
    font-size: 16px;
    line-height: 1.8;
    color: #333333;
    margin: 14px 0;
  }

  strong {
    font-weight: 700;
    color: #1a73e8;
  }

  em {
    font-style: italic;
    color: #666666;
  }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: #f8f9fa;
    color: #d73a49;
    padding: 2px 6px;
    border-radius: 4px;
  }

  pre {
    background: #f8f9fa;
    color: #333333;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 16px 0;
    line-height: 1.6;
    border: 1px solid #e0e0e0;
  }

  pre code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: none;
    color: #333333;
    padding: 0;
    border-radius: 0;
  }

  blockquote {
    border-left: 4px solid #1a73e8;
    background: #e8f0fe;
    margin: 16px 0;
    padding: 12px 16px;
    border-radius: 0 6px 6px 0;
    color: #555555;
  }

  blockquote p {
    margin: 8px 0;
    color: #555555;
  }

  ul {
    padding-left: 24px;
    margin: 14px 0;
  }

  ol {
    padding-left: 24px;
    margin: 14px 0;
  }

  li {
    font-size: 16px;
    line-height: 1.8;
    color: #333333;
    margin: 6px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 15px;
  }

  th {
    background: #1a73e8;
    color: #ffffff;
    font-weight: 600;
    padding: 10px 14px;
    text-align: left;
    border: 1px solid #1a73e8;
  }

  td {
    padding: 10px 14px;
    border: 1px solid #e0e0e0;
    color: #333333;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 24px auto;
    border-radius: 8px;
  }

  a {
    color: #1a73e8;
    text-decoration: none;
    font-weight: 500;
  }

  hr {
    border: none;
    border-top: 1px solid #e0e0e0;
    margin: 28px 0;
  }